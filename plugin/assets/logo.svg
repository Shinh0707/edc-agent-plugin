<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="edc-gradient-primary" x1="28" y1="28" x2="228" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="edc-gradient-accent" x1="60" y1="60" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="edc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring / Framework (10% Margin inside 256x256) -->
  <rect x="32" y="32" width="192" height="192" rx="42" stroke="url(#edc-gradient-primary)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Dynamic Entertainment Arc / Prism Wave -->
  <path d="M 64 128 C 64 80, 100 64, 128 64 C 156 64, 192 80, 192 128 C 192 176, 156 192, 128 192 C 100 192, 64 176, 64 128 Z"
        stroke="url(#edc-gradient-accent)" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Center Prism Spark / Tag Core -->
  <polygon points="128,76 148,114 186,128 148,142 128,180 108,142 70,128 108,114" fill="url(#edc-gradient-primary)" filter="url(#edc-glow)" />

  <!-- Tag Nodes (Cognition, Perception, Emotion, Motivation) -->
  <circle cx="84" cy="84" r="8" fill="#38BDF8" />
  <circle cx="172" cy="84" r="8" fill="#F43F5E" />
  <circle cx="84" cy="172" r="8" fill="#A855F7" />
  <circle cx="172" cy="172" r="8" fill="#38BDF8" />

  <!-- Inner Spark Center -->
  <circle cx="128" cy="128" r="6" fill="#FFFFFF" />
</svg>
