name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/mcp/package-lock.json
      - name: MCP サーバーをビルド
        working-directory: plugin/mcp
        run: npm ci && npm run build
      - name: 構文の確認
        run: |
          node --check plugin/mcp/launcher.mjs
          node --check plugin/mcp/dist/index.mjs
          sh -n install/install.sh
      - name: MCP サーバーが起動し、4つのツールを出す
        working-directory: plugin
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (cat; sleep 5) | timeout 15 node mcp/launcher.mjs > tools.jsonl || true
          node -e 'const l=require("fs").readFileSync("tools.jsonl","utf8").trim().split("\n").map(JSON.parse).find(m=>m.id===2); const n=l.result.tools.map(t=>t.name).sort(); console.log(n); if(n.length!==4) process.exit(1)'
      - name: zip を作れる(シークレットなし)
        run: node scripts/package.mjs --allow-missing-secret
      - name: zip に秘密のファイルが入っていない
        run: |
          unzip -l dist/entertainment-design-catalog.zip
          ! unzip -l dist/entertainment-design-catalog.zip | grep -E '(^|/)(\.env|auth\.json)$|node_modules/'
      - uses: actions/upload-artifact@v4
        with:
          name: zip
          path: dist/

  # インストーラを実際に動かす(手元に PowerShell がないため、Windows はここでだけ確かめる)
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: zip
          path: rel
      - name: zip を配る仮のサーバー
        shell: bash
        run: |
          (cd rel && python3 -m http.server 18080 >/dev/null 2>&1 &) || (cd rel && python -m http.server 18080 >/dev/null 2>&1 &)
          sleep 2
      - name: install.sh(新規 → 上書き。.env は引き継ぐ)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EDC_PLUGIN_BASE_URL: http://127.0.0.1:18080
        run: |
          sh install/install.sh --no-login </dev/null
          D="$HOME/.gemini/config/plugins/entertainment-design-catalog"
          echo "MY=1" > "$D/.env"
          sh install/install.sh --no-login </dev/null
          test "$(cat "$D/.env")" = "MY=1"
          test -z "$(find "$D" -type f -size 0)"
          cd "$D" && node mcp/launcher.mjs status
      - name: install.ps1(新規 → 上書き。.env は引き継ぐ)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EDC_PLUGIN_BASE_URL: http://127.0.0.1:18080
          EDC_NO_LOGIN: "1"
        run: |
          ./install/install.ps1
          $d = Join-Path $HOME ".gemini\config\plugins\entertainment-design-catalog"
          Set-Content "$d\.env" "MY=1"
          ./install/install.ps1
          if ((Get-Content "$d\.env" -Raw).Trim() -ne "MY=1") { throw ".env が引き継がれていない" }
          if (Get-ChildItem -Recurse -File $d | Where-Object Length -eq 0) { throw "空のファイルがある" }
          Push-Location $d; node mcp/launcher.mjs status; Pop-Location
